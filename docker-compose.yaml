services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: casa_ai
      POSTGRES_USER: casa_ai
      POSTGRES_PASSWORD: casa_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
