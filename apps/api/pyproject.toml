[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

# resolve import/path issues with tests
# https://stackoverflow.com/questions/10253826/path-issue-with-pytest-importerror-no-module-named
[tool.pytest.ini_options]
pythonpath = ["."]
